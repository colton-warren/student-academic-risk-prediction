# Experiment parameters. Change a value and `dvc repro` reruns only what
# depends on it. To try a variation without editing the file:
#   dvc exp run --set-param models.forest.n_estimators=800
#   dvc exp show
# That is also how to do the hyperparameter-tuning objective from the
# conceptual design: sweep a value, then compare runs.

experiment:
  # Appended to each MLflow run name, per the naming convention in the
  # conceptual design (model, then feature set, then trial: _v1, _v2, ...).
  run_version: v1
  target_column: target
  # The class the project exists to catch. Recall on it picks the best model.
  focus_class: Dropout
  test_size: 0.2
  random_state: 42
  # Stratified because the classes are uneven (roughly 50/32/18); an unstratified
  # split lets the test set's class mix wander, which moves the metrics on its own.
  stratify: true
  feature_sets:
    - enrollment_only
    - through_sem1
    - all_features

models:
  # Hyperparameters named in the conceptual design, so each one is tracked.
  logreg:
    # Inverse regularisation strength: smaller means stronger regularisation.
    C: 1.0
    # The conceptual design calls this "penalty type". scikit-learn deprecated
    # the `penalty` argument in 1.8 and removes it in 1.10, so it is expressed
    # as l1_ratio instead: 0 is ridge (L2), 1 is lasso (L1), between the two is
    # elastic net. Anything above 0 needs solver: saga -- lbfgs only does L2.
    l1_ratio: 0
    solver: lbfgs
    max_iter: 1000
  forest:
    n_estimators: 300
    max_depth: null
    min_samples_split: 2
    max_features: sqrt

# Hyperparameters set in the KNIME learner dialogs. KNIME cannot pass node
# settings to MLflow, so they are recorded here and logged alongside the
# Scorer results by src/log_knime_runs.py. Keep them in step with the nodes --
# nothing detects it if they drift.
knime_models:
  forest:
    n_trees: 300
    max_depth: unlimited
    min_node_size: 1
    max_features: sqrt
  logreg:
    solver: iteratively_reweighted_least_squares
    regularization: none
    preprocessing: z_score_normalizer
