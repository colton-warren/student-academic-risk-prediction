# Expected shape of the prepared dataset.
#
# Section 5 of the proposal promises validation: required columns and types,
# missing values, duplicates, unexpected categories, unrealistic ranges, and
# drift in the target distribution. This file is what those checks compare
# against, and src/verify_prep.py runs them.
#
# The ranges were observed in the reference dataset, so they describe what is
# normal here rather than what is physically possible. A value outside them is
# a prompt to look, not proof of corruption.
#
# target_balance_tolerance is an absolute proportion: 0.10 means a class may
# drift ten percentage points before the check complains.
